<!doctype html>
<html lang="fi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EasyVid</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <div class="appFrame">
        <header class="topbar">
          <div class="topBrand" aria-label="EasyVid">
            <span class="mark" aria-hidden="true"></span>
            <strong>EasyVid</strong>
          </div>
          <nav class="modeNav" aria-label="Sisältötila">
            <button class="modeButton is-active" type="button" data-mode="picture" aria-current="page">Picture</button>
            <button class="modeButton" type="button" data-mode="video">Video</button>
          </nav>
          <div class="topActions">
            <button id="themeToggle" class="iconButton" type="button" aria-label="Vaihda tumma tila" aria-pressed="false">☼</button>
            <span class="avatar">MK</span>
          </div>
        </header>

      <section class="workspace">
        <div class="panel controls">
          <label class="field projectCard">
            <span>Projektin nimi</span>
            <input id="projectName" maxlength="60" placeholder="esim. LeBron edit">
          </label>

          <div class="controlCard">
            <h2>Lisää biitti</h2>
            <label class="dropzone" id="audioDrop">
              <input id="audioInput" type="file" accept="audio/*">
              <span class="dropIcon">♪</span>
              <strong>Tiputa biitti tähän</strong>
              <small id="audioName">MP3, WAV, M4A tai muu selaimen tukema ääni</small>
            </label>
          </div>

          <div class="imageTools controlCard">
            <label class="field">
              <span id="sourceLinkLabel">Pinterest- tai kuvalinkki</span>
              <div class="urlRow">
                <input id="imageUrl" type="url" placeholder="https://pin.it/... tai https://i.pinimg.com/...">
                <button id="fetchImage" type="button">Hae</button>
              </div>
              <small id="imageStatus">Voit myös tiputtaa kuvatiedoston esikatselun päälle.</small>
            </label>
          </div>

          <div class="settings controlCard">
            <h2>Asetukset</h2>
            <label class="field">
              <span>Formaatti</span>
              <select id="formatSelect">
                <option value="story">Pystyvideo 1080 × 1920</option>
                <option value="square">Neliö 1080 × 1080</option>
                <option value="landscape" selected>Vaaka 1920 × 1080</option>
              </select>
            </label>

            <label class="field">
              <span>Otsikko (Lisää tekstin videoon)</span>
              <input id="titleText" maxlength="48" placeholder="esim. midnight bounce">
            </label>

            <div class="advancedSection">
              <button id="advancedToggle" class="advancedToggleButton" type="button" aria-expanded="false" aria-controls="advancedPanel">
                <span>Lisäasetukset</span>
              </button>

              <div id="advancedPanel" class="advancedPanel">
                <div class="cropControls">
                  <label class="field">
                    <span id="fitLabel">Kuvan sovitus</span>
                    <select id="imageFit">
                      <option value="cover">Täytä ja rajaa</option>
                      <option value="contain">Sovita kokonaan</option>
                    </select>
                  </label>

                  <label class="rangeField">
                    <span>Zoom</span>
                    <input id="imageZoom" type="range" min="100" max="220" value="100">
                  </label>

                  <label class="rangeField">
                    <span>Siirrä vaakaan</span>
                    <input id="imageOffsetX" type="range" min="-100" max="100" value="0">
                  </label>

                  <label class="rangeField">
                    <span>Siirrä pystyyn</span>
                    <input id="imageOffsetY" type="range" min="-100" max="100" value="0">
                  </label>

                  <button id="resetImageCrop" type="button" class="secondaryButton">Nollaa rajaus</button>
                </div>

                <div class="filterControls">
                  <label class="rangeField">
                    <span>Blur</span>
                    <input id="filterBlur" type="range" min="0" max="24" value="0">
                  </label>

                  <label class="rangeField">
                    <span>Grain</span>
                    <input id="filterGrain" type="range" min="0" max="70" value="0">
                  </label>

                  <label class="rangeField">
                    <span>Vintage</span>
                    <input id="filterVintage" type="range" min="0" max="100" value="0">
                  </label>

                  <label class="rangeField">
                    <span>Contrast</span>
                    <input id="filterContrast" type="range" min="50" max="180" value="100">
                  </label>

                  <label class="rangeField">
                    <span>Saturation</span>
                    <input id="filterSaturation" type="range" min="0" max="220" value="100">
                  </label>

                  <button id="resetFilters" type="button" class="secondaryButton">Nollaa suodattimet</button>
                </div>

                <div class="backgroundControls">
                  <label class="field">
                    <span>Tausta</span>
                    <select id="backgroundMode">
                      <option value="black">Mustat reunat</option>
                      <option value="blur">Blur-tausta</option>
                      <option value="color">Värillinen tausta</option>
                      <option value="gradient">Gradientti</option>
                    </select>
                  </label>

                  <div class="colorRow">
                    <label class="swatchField">
                      <span>Väri 1</span>
                      <input id="backgroundColorA" type="color" value="#101114">
                    </label>
                    <label class="swatchField">
                      <span>Väri 2</span>
                      <input id="backgroundColorB" type="color" value="#e8583d">
                    </label>
                  </div>
                </div>

                <div class="actions">
                  <button id="previewButton" type="button">Esikatsele</button>
                  <button id="renderButton" type="button" disabled>Tee video</button>
                  <a id="downloadLink" class="download" hidden>Lataa video</a>
                </div>

                <div class="progressShell" hidden>
                  <div class="progressBar" id="progressBar"></div>
                </div>
              </div>
            </div>

          </div>

          <p class="notice" id="notice">Valitse biitti ja kuva, niin renderöinti avautuu.</p>
        </div>

        <div class="rightColumn">
          <div class="panel pinterestPanel">
            <div class="panelHeader">
              <span class="pinMark" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                  <path d="M12 2C6.48 2 2 6.28 2 11.57c0 3.94 2.47 7.32 6 8.78-.09-.67-.16-1.7.03-2.43l1.29-5.22s-.33-.63-.33-1.55c0-1.45.88-2.54 1.98-2.54.93 0 1.38.67 1.38 1.47 0 .9-.6 2.24-.91 3.48-.26 1.04.55 1.89 1.62 1.89 1.94 0 3.44-1.96 3.44-4.79 0-2.5-1.88-4.25-4.56-4.25-3.1 0-4.92 2.23-4.92 4.54 0 .9.36 1.86.81 2.38.09.1.1.19.07.3l-.3 1.15c-.05.19-.16.23-.36.14-1.35-.6-2.19-2.48-2.19-4 0-3.25 2.47-6.24 7.12-6.24 3.74 0 6.65 2.55 6.65 5.96 0 3.55-2.34 6.41-5.59 6.41-1.09 0-2.12-.54-2.47-1.18l-.67 2.45c-.24.9-.9 2.02-1.34 2.71 1.01.3 2.08.46 3.2.46 5.52 0 10-4.28 10-9.57C22 6.28 17.52 2 12 2Z"></path>
                </svg>
              </span>
              <div>
                <h2 id="searchPanelTitle">Pinterest haku</h2>
              </div>
            </div>

            <form id="pinterestForm" class="pinSearchForm" action="https://www.pinterest.com/search/pins/" method="get" target="_blank">
              <label class="field">
                <span id="searchFieldLabel">Haku Pinterestistä</span>
                <input id="pinterestQuery" name="q" placeholder="esim. dark anime street" autocomplete="off">
              </label>
              <button id="pinterestSearch" type="submit">Avaa haku</button>
            </form>

            <div class="pinActions">
              <button id="openPinterestHome" type="button" class="secondaryButton">Pinterest</button>
              <button id="pastePinterest" type="button" class="secondaryButton">Liitä kopioitu linkki</button>
            </div>
          </div>

          <label class="stageWrap" id="imageDrop">
            <input id="imageInput" type="file" accept="image/*">
            <canvas id="preview" width="1080" height="1920" aria-label="Videon esikatselu"></canvas>
          </label>
        </div>
      </section>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
